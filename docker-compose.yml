name: costalyx

# Costalyx local development stack - see 09-DEPLOYMENT.md.
# Run: make dev-up  (or: docker compose up -d)
# Seeds: dev Keycloak realm with fixed roles, dev Vault path, fixture cost data.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: costalyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-costalyx_dev}
      POSTGRES_USER: ${POSTGRES_USER:-costalyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DEV_ONLY}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - costalyx

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    container_name: costalyx-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME_DEV_ONLY}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./deploy/keycloak/costalyx-realm.json:/opt/keycloak/data/import/costalyx-dev-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - costalyx

  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.17}
    container_name: costalyx-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-CHANGE_ME_DEV_ONLY}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - costalyx

  redpanda:
    image: ${REDPANDA_IMAGE:-redpandadata/redpanda:v24.3.1}
    container_name: costalyx-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - costalyx

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21}
    container_name: costalyx-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - costalyx

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: costalyx-backend
    restart: unless-stopped
    command: ["npm", "--workspace", "backend", "run", "start:dev"]
    environment:
      APP_ENV: local
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://costalyx:CHANGE_ME_DEV_ONLY@postgres:5432/costalyx_dev
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/costalyx-dev}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/costalyx-dev/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: costalyx-dev
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-CHANGE_ME_DEV_ONLY}
      REDPANDA_BROKERS: redpanda:9092
      COSTALYX_LLM_NARRATIVES_ENABLED: ${COSTALYX_LLM_NARRATIVES_ENABLED:-disabled}
      COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH: ${COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH:-secret/data/costalyx/llm/provider-api-key}
      COSTALYX_RATE_LIMIT_MAX: ${COSTALYX_RATE_LIMIT_MAX:-5000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      USE_MOCKS: "false"
      SEED_FIXTURE_DATA: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - costalyx

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: costalyx-frontend
    restart: unless-stopped
    command: ["npm", "--workspace", "frontend", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: costalyx-dev
      VITE_KEYCLOAK_CLIENT_ID: costalyx-web
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - costalyx

networks:
  costalyx:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:
