          application/json:
            schema:
              $ref: "#/components/schemas/TcoEstimateRequest"
      responses:
        "200":
          description: Cross-cloud TCO estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TcoEstimateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
