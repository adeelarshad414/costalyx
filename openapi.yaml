                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Reject custom role creation until the custom-role milestone
      operationId: createRole
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /audit-log:
    get:
      tags: [admin]
      summary: List immutable audit log entries
      operationId: listAuditLog
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued OIDC access token.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every mutating request; duplicate keys return the original result.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ActiveViewId:
      name: X-Costalyx-View-Id
      in: header
      required: false
      description: Optional saved View applied as a session-wide data scope.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Provider:
      name: provider
      in: query
      schema:
        $ref: "#/components/schemas/CloudProvider"
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated caller lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Request conflicts with current state or idempotency replay
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://api.costalyx.local/errors/validation-error"]
        title:
          type: string
          examples: ["Validation Error"]
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CloudProvider:
      type: string
      enum: [aws, azure, gcp]

    LeaseType:
      type: string
      enum: [on_demand, reserved, savings_plan, spot]

    RoleName:
      type: string
      enum: [viewer, analyst, admin]

    Tenant:
      type: object
      required: [id, name, slug, plan, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [starter, business, enterprise]
        createdAt:
          type: string
          format: date-time

    TenantCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [starter, business, enterprise]

    CloudConnection:
      type: object
      required:
        - id
        - tenantId
        - provider
        - displayName
        - externalTenantId
        - accessMode
        - readOnlyPrincipal
        - billingExportUri
        - status
        - lastValidatedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/CloudProvider"
        displayName:
          type: string
        externalTenantId:
          type: string
          description: AWS account ID, Azure tenant/billing scope ID, or GCP billing account/project parent.
        accessMode:
          type: string
          enum: [aws_assume_role, azure_delegated_app, gcp_workload_identity]
        readOnlyPrincipal:
          type: string
          description: Role ARN, delegated app ID, or workload identity provider reference. Never a secret.
        billingExportUri:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending_validation, validated, validation_failed]
        lastValidatedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CloudConnectionCreate:
      type: object
      required: [provider, displayName, externalTenantId, accessMode, readOnlyPrincipal]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        displayName:
          type: string
        externalTenantId:
          type: string
        accessMode:
          type: string
          enum: [aws_assume_role, azure_delegated_app, gcp_workload_identity]
        readOnlyPrincipal:
          type: string
          description: Read-only delegated principal reference only.
        billingExportUri:
          type: string

    MoneyString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,8})?$'
      examples: ["1234.5600"]

    ListMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200

    Account:
      type: object
      required: [id, tenantId, provider, cloudConnectionId, externalAccountId, displayName, vendor, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/CloudProvider"
        cloudConnectionId:
          type: ["string", "null"]
          format: uuid
        externalAccountId:
          type: string
        displayName:
          type: string
        vendor:
          type: string
        createdAt:
          type: string
          format: date-time

    AccountCreate:
      type: object
      required: [provider, externalAccountId, displayName]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        externalAccountId:
          type: string
        displayName:
          type: string
        cloudConnectionId:
          type: string
          format: uuid
        vaultCredentialPath:
          type: string
          description: Vault/OpenBao path reference only; never a plaintext secret.

    AccountGroup:
      type: object
      required: [id, tenantId, name, accountIds, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        accountIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time

    AccountGroupCreate:
      type: object
      required: [name, accountIds]
      properties:
        name:
          type: string
        accountIds:
          type: array
          items:
            type: string
            format: uuid

    AccountGroupPatch:
      type: object
      properties:
        name:
          type: string
        accountIds:
          type: array
          items:
            type: string
            format: uuid

    CloudCredential:
      type: object
      required: [id, tenantId, provider, accountId, displayName, vaultPath, createdAt, rotatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/CloudProvider"
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        vaultPath:
          type: string
          description: Vault/OpenBao path reference only; never a plaintext or base64 credential.
        createdAt:
          type: string
          format: date-time
        rotatedAt:
          type: ["string", "null"]
          format: date-time

    CloudCredentialCreate:
      type: object
      required: [provider, accountId, displayName, vaultPath]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        vaultPath:
          type: string
          description: Vault/OpenBao path reference only; plaintext credential fields are rejected.

    CloudCredentialRotation:
      type: object
      required: [vaultPath]
      additionalProperties: false
      properties:
        vaultPath:
          type: string
          description: New Vault/OpenBao path reference only.

    CostRecord:
      type: object
      required:
        - id
        - provider
        - accountId
        - resourceId
        - serviceName
        - leaseType
        - hourlyRateUsd
        - usageHours
        - costTotalUsd
        - isEstimate
        - validFrom
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/CloudProvider"
        accountId:
          type: string
          format: uuid
        resourceId:
          type: string
        serviceName:
          type: string
        usageFamily:
          type: string
        leaseType:
          $ref: "#/components/schemas/LeaseType"
        transactionType:
          type: string
        hourlyRateUsd:
          $ref: "#/components/schemas/MoneyString"
        usageHours:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,4})?$'
        costTotalUsd:
          allOf:
            - $ref: "#/components/schemas/MoneyString"
          readOnly: true
          description: Computed at query time, never stored.
        isEstimate:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: ["string", "null"]
          format: date-time
        ingestedAt:
          type: string
          format: date-time

    CostSummary:
      type: object
      required: [totalCostUsd, resourceCount, untaggedCount, inactiveCount, isEstimate]
      properties:
        totalCostUsd:
          $ref: "#/components/schemas/MoneyString"
        resourceCount:
          type: integer
          minimum: 0
        untaggedCount:
          type: integer
          minimum: 0
        inactiveCount:
          type: integer
          minimum: 0
        isEstimate:
          type: boolean

    CostExplorerFlow:
      type: object
      required: [nodes, links]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, label, costTotalUsd]
            properties:
              id:
                type: string
              label:
                type: string
              costTotalUsd:
                $ref: "#/components/schemas/MoneyString"
        links:
          type: array
          items:
            type: object
            required: [source, target, costTotalUsd]
            properties:
              source:
                type: string
              target:
                type: string
              costTotalUsd:
                $ref: "#/components/schemas/MoneyString"

    Dimension:
      type: object
      required: [id, orgId, name, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    DimensionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    DimensionMapping:
      type: object
      required: [id, dimensionId, tagKey]
      properties:
        id:
          type: string
          format: uuid
        dimensionId:
          type: string
          format: uuid
        tagKey:
          type: string
        tagValuePattern:
          type: ["string", "null"]

    DimensionMappingCreate:
      type: object
      required: [tagKey]
      properties:
        tagKey:
          type: string
        tagValuePattern:
          type: ["string", "null"]

    ResourceTag:
      type: object
      required: [resourceId, tagKey, tagValue, source]
      properties:
        resourceId:
          type: string
        tagKey:
          type: string
        tagValue:
          type: string
        source:
          type: string
          enum: [native, manual, inferred]

    ResourceTagUpsert:
      type: object
      required: [resourceId, tagKey, tagValue, source]
      properties:
        resourceId:
          type: string
        tagKey:
          type: string
        tagValue:
          type: string
        source:
          type: string
          enum: [native, manual, inferred]

    IngestionBatch:
      type: object
      required: [id, provider, status, createdAt, ingestedRows, duplicateRows]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/CloudProvider"
        status:
          type: string
          enum: [pending, processing, complete, failed]
        cloudConnectionId:
          type: ["string", "null"]
          format: uuid
        sourceUri:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        ingestedRows:
          type: integer
          minimum: 0
        duplicateRows:
          type: integer
          minimum: 0

    IngestionBatchCreate:
      type: object
      required: [provider, sourceUri]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        sourceUri:
          type: string
          description: Provider-native source URI or object reference.
        cloudConnectionId:
          type: string
          format: uuid

    IngestionError:
      type: object
      required: [id, batchId, rowNumber, detail]
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        rowNumber:
          type: integer
          minimum: 1
        detail:
          type: string

    RecommendationStatus:
      type: string
      enum: [open, applied, dismissed]

    Recommendation:
      type: object
      required: [id, type, resourceId, estimatedSavingsUsd, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        type:
          type: string
          enum: [rightsizing, ri_purchase, idle, commitment_gap]
        resourceId:
          type: string
        estimatedSavingsUsd:
          $ref: "#/components/schemas/MoneyString"
        status:
          $ref: "#/components/schemas/RecommendationStatus"
        createdAt:
          type: string
          format: date-time

    RecommendationPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [applied, dismissed]

    RealizedSaving:
      type: object
      required:
        - id
        - recommendationId
        - appliedAt
        - baselineCostUsd
        - actualCostUsd
        - deltaUsd
        - verificationSource
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        recommendationId:
          type: string
          format: uuid
        appliedAt:
          type: string
          format: date-time
        baselineCostUsd:
          $ref: "#/components/schemas/MoneyString"
        actualCostUsd:
          $ref: "#/components/schemas/MoneyString"
        deltaUsd:
          $ref: "#/components/schemas/MoneyString"
        verificationSource:
          type: string
          enum: [ingested_billing]

    ReportCategory:
      type: string
      enum: [cost, cost_summary, invoices, utilization, underutilization]

    Report:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/ReportCategory"
        description:
          type: string

    ReportRun:
      type: object
      required: [reportId, generatedAt, rows]
      properties:
        reportId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

    View:
      type: object
      required: [id, orgId, name, filterJson, ownerId, sharedRoleScope]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        filterJson:
          type: object
          additionalProperties: true
        ownerId:
          type: string
          format: uuid
        sharedRoleScope:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"

    ViewCreate:
      type: object
      required: [name, filterJson]
      properties:
        name:
          type: string
        filterJson:
          type: object
          additionalProperties: true
        sharedRoleScope:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"

    ExecutiveSummary:
      type: object
      required:
        - totalSpendUsd
        - revenueBaselineUsd
        - spendAsRevenuePercent
        - budgetBaselineUsd
        - budgetUsedPercent
        - trend
        - topMovers
      properties:
        totalSpendUsd:
          $ref: "#/components/schemas/MoneyString"
        revenueBaselineUsd:
          $ref: "#/components/schemas/MoneyString"
        spendAsRevenuePercent:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,4})?$'
        budgetBaselineUsd:
          $ref: "#/components/schemas/MoneyString"
        budgetUsedPercent:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,4})?$'
        trend:
          $ref: "#/components/schemas/ExecutiveTrend"
        topMovers:
          type: array
          items:
