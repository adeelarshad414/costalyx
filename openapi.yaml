openapi: 3.1.0
info:
  title: Costalyx API
  version: 1.0.0
  description: >
    Multi-cloud cost intelligence platform API. This is a scaffolding
    skeleton generated from 02-DATA-MODEL.md and 03-API-CONTRACTS.md.
    Codex should extend, not replace, this structure. Additive-only changes
    once implementation begins (see 02-DATA-MODEL.md migration discipline).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: Same-origin API v1
  - url: http://localhost:3000/api/v1
    description: Local development API v1
tags:
  - name: health
  - name: ingestion
  - name: cost-data
  - name: accounts
  - name: dimensions
  - name: optimization
  - name: executive
  - name: reporting
  - name: tco
  - name: admin
  - name: tenants
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      servers:
        - url: http://localhost:3000
          description: Local backend root
      tags: [health]
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Backend process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      servers:
        - url: http://localhost:3000
          description: Local backend root
      tags: [health]
      summary: Prometheus metrics
      operationId: getMetrics
      x-required-role: admin
      responses:
        "200":
          description: Prometheus-compatible metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ingestion/batches:
    post:
      tags: [ingestion]
      summary: Trigger a manual ingestion run
      operationId: createIngestionBatch
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionBatchCreate"
      responses:
        "202":
          description: Ingestion batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ingestion/batches/{id}:
    get:
      tags: [ingestion]
      summary: Get ingestion batch status
      operationId: getIngestionBatch
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ingestion batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ingestion/batches/{id}/errors:
    get:
      tags: [ingestion]
      summary: List row-level ingestion errors
      operationId: listIngestionBatchErrors
      x-required-role: analyst
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated ingestion errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIngestionErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cost-records:
    get:
      tags: [cost-data]
      summary: List normalized cost records
      operationId: listCostRecords
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/ActiveViewId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Provider"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountGroupId
          in: query
          schema:
            type: string
            format: uuid
        - name: cloudConnectionId
          in: query
          schema:
            type: string
            format: uuid
        - name: service
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: dimension
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated cost records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCostRecords"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cost-records/summary:
    get:
      tags: [cost-data]
      summary: Get pre-aggregated cost totals
      operationId: getCostRecordsSummary
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/ActiveViewId"
        - $ref: "#/components/parameters/Provider"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountGroupId
          in: query
          schema:
            type: string
            format: uuid
        - name: cloudConnectionId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: dimension
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cost-records/export:
    get:
      tags: [cost-data]
      summary: Export normalized cost records as CSV
      operationId: exportCostRecords
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/ActiveViewId"
      responses:
        "200":
          description: CSV export of normalized cost records
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cost-explorer/flow:
    get:
      tags: [cost-data]
      summary: Get Sankey-shaped cost explorer flow
      operationId: getCostExplorerFlow
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/ActiveViewId"
        - $ref: "#/components/parameters/Provider"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountGroupId
          in: query
          schema:
            type: string
            format: uuid
        - name: cloudConnectionId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: dimensions
          in: query
          description: Ordered dimensions to drill through
          schema:
            type: array
            items:
              type: string
        - name: costFloorUsd
          in: query
          schema:
            $ref: "#/components/schemas/MoneyString"
      responses:
        "200":
          description: Sankey flow graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostExplorerFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants:
    get:
      tags: [tenants]
      summary: List tenants available to the authenticated principal
      operationId: listTenants
      x-required-role: viewer
      responses:
        "200":
          description: Tenant memberships
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [tenants]
      summary: Create a tenant shell
      operationId: createTenant
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cloud-connections:
    get:
      tags: [accounts]
      summary: List read-only cloud account connections for the active tenant
      operationId: listCloudConnections
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated cloud connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCloudConnections"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      summary: Register a read-only cloud connection reference
      operationId: createCloudConnection
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudConnectionCreate"
      responses:
        "201":
          description: Cloud connection registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cloud-connections/{id}/validation:
    post:
      tags: [accounts]
      summary: Validate read-only cloud connection metadata
      operationId: validateCloudConnection
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Cloud connection validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts:
    get:
      tags: [accounts]
      summary: List cloud billing accounts
      operationId: listAccounts
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: Paginated accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAccounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      summary: Create a cloud billing account reference
      operationId: createAccount
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account-groups:
    get:
      tags: [accounts]
      summary: List account groups
      operationId: listAccountGroups
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated account groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAccountGroups"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      summary: Create an account group
      operationId: createAccountGroup
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountGroupCreate"
      responses:
        "201":
          description: Account group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account-groups/{id}:
    patch:
      tags: [accounts]
      summary: Update an account group
      operationId: updateAccountGroup
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountGroupPatch"
      responses:
        "200":
          description: Account group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [accounts]
      summary: Delete an account group
      operationId: deleteAccountGroup
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Account group deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cloud-credentials:
    get:
      tags: [accounts]
      summary: List cloud credential Vault references
      operationId: listCloudCredentials
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated credential references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCloudCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      summary: Register a cloud credential Vault reference
      operationId: createCloudCredential
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialCreate"
      responses:
        "201":
          description: Credential reference registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cloud-credentials/{id}/rotation:
    patch:
      tags: [accounts]
      summary: Rotate a cloud credential Vault reference
      operationId: rotateCloudCredential
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialRotation"
      responses:
        "200":
          description: Credential reference rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dimensions:
    get:
      tags: [dimensions]
      summary: List custom dimensions
      operationId: listDimensions
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDimensions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [dimensions]
      summary: Create an unbounded custom dimension
      operationId: createDimension
      x-required-role: analyst
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionCreate"
      responses:
        "201":
          description: Dimension created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /dimensions/{id}/mappings:
    post:
      tags: [dimensions]
      summary: Add a tag mapping to a dimension
      operationId: createDimensionMapping
      x-required-role: analyst
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionMappingCreate"
      responses:
        "201":
          description: Dimension mapping created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionMapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource-tags:
    get:
      tags: [dimensions]
      summary: List tags for a resource
      operationId: listResourceTags
      x-required-role: viewer
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated resource tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResourceTags"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [dimensions]
      summary: Upsert a manual or inferred resource tag
      operationId: upsertResourceTag
      x-required-role: analyst
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTagUpsert"
      responses:
        "201":
          description: Resource tag upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recommendations:
    get:
      tags: [optimization]
      summary: List optimization recommendations
      operationId: listRecommendations
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RecommendationStatus"
      responses:
        "200":
          description: Paginated recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRecommendations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recommendations/{id}:
    patch:
      tags: [optimization]
      summary: Update recommendation status
      operationId: updateRecommendation
      x-required-role: analyst
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationPatch"
      responses:
        "200":
          description: Recommendation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /realized-savings:
    get:
      tags: [optimization]
      summary: List realized savings ledger rows
      operationId: listRealizedSavings
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated realized savings rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRealizedSavings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports:
    get:
      tags: [reporting]
      summary: List canned reports
      operationId: listReports
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ReportCategory"
      responses:
        "200":
          description: Paginated report catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReports"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/{id}/run:
    get:
      tags: [reporting]
      summary: Run a canned report
      operationId: runReport
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ActiveViewId"
        - $ref: "#/components/parameters/Provider"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountGroupId
          in: query
          schema:
            type: string
            format: uuid
        - name: cloudConnectionId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /views:
