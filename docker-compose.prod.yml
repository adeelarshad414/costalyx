name: costalyx-prod

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-costalyx}
      POSTGRES_USER: ${POSTGRES_USER:-costalyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD from the production secret store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - costalyx

  backend:
    image: ${COSTALYX_BACKEND_IMAGE:-costalyx-backend:${COSTALYX_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL from Vault or the production secret store}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?Set production Keycloak issuer URL}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?Set production Keycloak JWKS URL}
      COSTALYX_ALLOWED_ORIGINS: ${COSTALYX_ALLOWED_ORIGINS:?Set comma-separated production browser origins for CORS}
      VAULT_ADDR: ${VAULT_ADDR:?Set production Vault address}
      VAULT_TOKEN: ${VAULT_TOKEN:?Set runtime Vault token or workload identity token}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-}
      COSTALYX_LIVE_CLOUD_PROBES: ${COSTALYX_LIVE_CLOUD_PROBES:-}
      COSTALYX_AWS_BROKER_PRINCIPAL_ARN: ${COSTALYX_AWS_BROKER_PRINCIPAL_ARN:-}
      COSTALYX_AWS_PROBE_REGION: ${COSTALYX_AWS_PROBE_REGION:-}
      COSTALYX_AWS_INGESTION_REGION: ${COSTALYX_AWS_INGESTION_REGION:-}
      COSTALYX_GCP_BIGQUERY_LOCATION: ${COSTALYX_GCP_BIGQUERY_LOCATION:-}
      COSTALYX_LLM_NARRATIVES_ENABLED: ${COSTALYX_LLM_NARRATIVES_ENABLED:-disabled}
      COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH: ${COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH:-}
      USE_MOCKS: "false"
      SEED_FIXTURE_DATA: ${SEED_FIXTURE_DATA:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - costalyx

  worker:
    image: ${COSTALYX_BACKEND_IMAGE:-costalyx-backend:${COSTALYX_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["npm", "--workspace", "backend", "run", "start:worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL from Vault or the production secret store}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?Set production Keycloak issuer URL}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?Set production Keycloak JWKS URL}
      VAULT_ADDR: ${VAULT_ADDR:?Set production Vault address}
      VAULT_TOKEN: ${VAULT_TOKEN:?Set runtime Vault token or workload identity token}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-}
      COSTALYX_LIVE_CLOUD_PROBES: ${COSTALYX_LIVE_CLOUD_PROBES:-}
      COSTALYX_AWS_BROKER_PRINCIPAL_ARN: ${COSTALYX_AWS_BROKER_PRINCIPAL_ARN:-}
      COSTALYX_AWS_PROBE_REGION: ${COSTALYX_AWS_PROBE_REGION:-}
      COSTALYX_AWS_INGESTION_REGION: ${COSTALYX_AWS_INGESTION_REGION:-}
      COSTALYX_GCP_BIGQUERY_LOCATION: ${COSTALYX_GCP_BIGQUERY_LOCATION:-}
      COSTALYX_CLOUD_SCHEDULER_ENABLED: ${COSTALYX_CLOUD_SCHEDULER_ENABLED:-enabled}
      COSTALYX_CLOUD_SCHEDULER_INTERVAL_MS: ${COSTALYX_CLOUD_SCHEDULER_INTERVAL_MS:-900000}
      COSTALYX_CLOUD_SCHEDULER_INGESTION_ENABLED: ${COSTALYX_CLOUD_SCHEDULER_INGESTION_ENABLED:-}
      COSTALYX_BILLING_AGENT_TENANT_IDS: ${COSTALYX_BILLING_AGENT_TENANT_IDS:-}
      COSTALYX_BILLING_AGENT_ANOMALY_SCAN_ENABLED: ${COSTALYX_BILLING_AGENT_ANOMALY_SCAN_ENABLED:-}
      COSTALYX_BILLING_AGENT_STATEMENT_GENERATION_ENABLED: ${COSTALYX_BILLING_AGENT_STATEMENT_GENERATION_ENABLED:-}
      COSTALYX_BILLING_AGENT_STATEMENT_SEND_ENABLED: ${COSTALYX_BILLING_AGENT_STATEMENT_SEND_ENABLED:-}
      COSTALYX_BILLING_AGENT_STATEMENT_SEND_LIMIT: ${COSTALYX_BILLING_AGENT_STATEMENT_SEND_LIMIT:-10}
      COSTALYX_BILLING_AGENT_PERIOD_START: ${COSTALYX_BILLING_AGENT_PERIOD_START:-}
      COSTALYX_BILLING_AGENT_PERIOD_END: ${COSTALYX_BILLING_AGENT_PERIOD_END:-}
      COSTALYX_LLM_NARRATIVES_ENABLED: ${COSTALYX_LLM_NARRATIVES_ENABLED:-disabled}
      COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH: ${COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH:-}
      USE_MOCKS: "false"
      SEED_FIXTURE_DATA: ${SEED_FIXTURE_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - costalyx

  frontend:
    image: ${COSTALYX_FRONTEND_IMAGE:-costalyx-frontend:${COSTALYX_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set production API base URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?Set production Keycloak base URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:?Set production Keycloak realm}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:?Set production Keycloak client ID}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - costalyx

networks:
  costalyx:
    driver: bridge

volumes:
  postgres_data:
