name: Costalyx CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:theme-colors
      - run: npm run ci:live-contract
        timeout-minutes: 3
      - run: npm --workspace backend run build
      - run: npm --workspace frontend run build
      - run: npm audit --audit-level=high

  deploy-check:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose config
        run: docker compose -f docker-compose.prod.yml config
        env:
          POSTGRES_PASSWORD: placeholder-postgres-password
          DATABASE_URL: postgresql://costalyx:placeholder-postgres-password@postgres:5432/costalyx
          KEYCLOAK_ISSUER_URL: https://auth.example.test/realms/costalyx
          KEYCLOAK_JWKS_URL: https://auth.example.test/realms/costalyx/protocol/openid-connect/certs
          COSTALYX_ALLOWED_ORIGINS: https://app.example.test,https://auth.example.test
          VAULT_ADDR: https://vault.example.test
          VAULT_TOKEN: placeholder-vault-token
          VITE_API_BASE_URL: https://api.example.test/api/v1
          VITE_KEYCLOAK_URL: https://auth.example.test
          VITE_KEYCLOAK_REALM: costalyx
          VITE_KEYCLOAK_CLIENT_ID: costalyx-web
          COSTALYX_AWS_BROKER_PRINCIPAL_ARN: arn:aws:iam::999999999999:role/CostalyxBroker
          COSTALYX_AWS_PROBE_REGION: us-east-1
          COSTALYX_AWS_INGESTION_REGION: us-west-2
          COSTALYX_GCP_BIGQUERY_LOCATION: US
      - name: Build backend production image
        run: docker buildx build --load -f backend/Dockerfile -t costalyx-backend:${{ github.sha }} .
      - name: Verify backend worker entrypoint
        run: docker run --rm --entrypoint ls costalyx-backend:${{ github.sha }} /app/backend/dist/worker.js
      - name: Build frontend production image
        run: >-
          docker buildx build --load -f frontend/Dockerfile
          -t costalyx-frontend:${{ github.sha }}
          --build-arg VITE_API_BASE_URL=https://api.example.test/api/v1
          --build-arg VITE_KEYCLOAK_URL=https://auth.example.test
          --build-arg VITE_KEYCLOAK_REALM=costalyx
          --build-arg VITE_KEYCLOAK_CLIENT_ID=costalyx-web
          .
      - name: Lint Helm chart
        run: helm lint deploy/helm/costalyx
      - name: Render Helm chart
        run: helm template costalyx deploy/helm/costalyx --namespace costalyx
      - name: Render Helm chart with worker and cloud config
        run: >-
          helm template costalyx deploy/helm/costalyx
          --namespace costalyx
          --set worker.enabled=true
          --set config.awsIngestionRegion=us-west-2
          --set config.gcpBigQueryLocation=US

  e2e:
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_ENABLED == 'true' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d
      - run: npm run test:e2e:keycloak
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE_URL: http://127.0.0.1:3000/api/v1
          E2E_KEYCLOAK_URL: http://127.0.0.1:8080
      - run: docker compose down -v
        if: ${{ always() }}
