apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "costalyx.fullname" . }}-config
  labels:
    {{- include "costalyx.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  KEYCLOAK_ISSUER_URL: {{ .Values.config.keycloakIssuerUrl | quote }}
  KEYCLOAK_JWKS_URL: {{ .Values.config.keycloakJwksUrl | quote }}
  COSTALYX_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  VAULT_ADDR: {{ .Values.config.vaultAddr | quote }}
  REDPANDA_BROKERS: {{ .Values.config.redpandaBrokers | quote }}
  COSTALYX_LIVE_CLOUD_PROBES: {{ .Values.config.liveCloudProbes | quote }}
  COSTALYX_AWS_BROKER_PRINCIPAL_ARN: {{ .Values.config.awsBrokerPrincipalArn | quote }}
  COSTALYX_AWS_PROBE_REGION: {{ .Values.config.awsProbeRegion | quote }}
  COSTALYX_AWS_INGESTION_REGION: {{ .Values.config.awsIngestionRegion | quote }}
  COSTALYX_GCP_BIGQUERY_LOCATION: {{ .Values.config.gcpBigQueryLocation | quote }}
  COSTALYX_LLM_NARRATIVES_ENABLED: {{ .Values.config.llmNarrativesEnabled | quote }}
  COSTALYX_LLM_PROVIDER_KEY_VAULT_PATH: {{ .Values.config.llmProviderKeyVaultPath | quote }}
  USE_MOCKS: {{ .Values.config.useMocks | quote }}
  SEED_FIXTURE_DATA: {{ .Values.config.seedFixtureData | quote }}
