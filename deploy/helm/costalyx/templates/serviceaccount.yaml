{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "costalyx.backendServiceAccountName" . }}
  labels:
    {{- include "costalyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "costalyx.frontendServiceAccountName" . }}
  labels:
    {{- include "costalyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
