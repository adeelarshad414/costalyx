apiVersion: v1
kind: Service
metadata:
  name: {{ include "costalyx.backendName" . }}
  labels:
    {{- include "costalyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "costalyx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "costalyx.frontendName" . }}
  labels:
    {{- include "costalyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "costalyx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
